name: Test video bot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate startup scripts and Codespaces image
        run: |
          bash -n scripts/setup.sh scripts/start.sh
          docker manifest inspect mcr.microsoft.com/devcontainers/universal:6-noble > /dev/null
      - name: Prepare environment using the Codespaces setup script
        run: |
          bash scripts/setup.sh
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Check syntax and imports
        run: |
          python -m compileall -q bot.py media.py tests
          python -c "import bot; import media"
      - name: Require real video tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Run unit, bot and real video tests
        run: python -m unittest discover -s tests -v
