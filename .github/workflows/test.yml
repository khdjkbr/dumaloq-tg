name: Test video bot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax and imports
        run: |
          python -m compileall -q bot.py media.py tests
          python -c "import bot; import media"
      - name: Require real video tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Run unit, bot and real video tests
        run: python -m unittest discover -s tests -v
